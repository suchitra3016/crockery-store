<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/cart.css">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <title>Your cart | Tidewell Ceramics</title>
</head>
<body style="display:flex;flex-direction:column;min-height:100vh">
  <div id="site-header"></div>
  <main id="main">
    <section class="page-head"><div class="container"><h1>Your cart</h1></div></section>
    <section class="section" style="padding-top:2rem"><div class="container">
      <div class="empty" id="empty" hidden style="padding:3rem 1rem;text-align:center;background:var(--white);border:1px dashed #B9C3BE">
        <h2>Your cart is empty</h2><p style="margin-inline:auto">Add something from the shop and it will appear here.</p>
        <a class="btn" href="shop.html">Browse the shop</a></div>
      <div class="cart-layout" id="cart-content" hidden>
        <div>
          <div id="lines"></div>
          <p style="margin-top:1rem"><button type="button" class="link-btn" id="clear" style="margin-left:0">Empty cart</button></p>
        </div>
        <aside class="summary" aria-label="Order summary">
          <h2>Order summary</h2>
          <div class="sum-row"><span>Subtotal</span><span id="sum-subtotal"></span></div>
          <div class="sum-row"><span>Shipping</span><span id="sum-shipping"></span></div>
          <div class="sum-row"><span>Tax (8%)</span><span id="sum-tax"></span></div>
          <div class="sum-row total"><span>Total</span><span id="sum-total"></span></div>
          <p class="sum-note" id="ship-note"></p>
          <a class="btn" href="checkout.html">Checkout</a>
        </aside>
      </div>
    </div></section>
  </main>
  <div id="site-footer"></div>
  <script src="js/products.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/cart-page.js"></script>
</body>
</html>
